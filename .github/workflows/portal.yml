name: Exam portal checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start seeded portal and test browser workflow
        shell: bash
        run: |
          export PORTAL_STATE_DIR=/tmp/gayatri-portal-ci-state
          export PORTAL_E2E_STATE_DIR="$PORTAL_STATE_DIR"
          export PORTAL_TEST_PYTHON=python
          python -m scripts.seed_db
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/portal-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
          cd frontend
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          npx playwright test
